name: Build Card Manager

# Builds the GD MENU Card Manager (WPF for Windows and the Avalonia version) and runs the scraper's offline tests.
# Artifacts: the Windows build, and macOS app bundles for Apple Silicon (arm64) and Intel (x64). The bundles are
# cross-built on Linux and ad-hoc signed with rcodesign by Derek's create-macos-bundle.sh, as his releases are (hosted
# macOS runners are often not available). Such a bundle runs, but fails `codesign --verify --strict`; on a Mac it can
# be re-sealed with `codesign --force --deep -s - GDMENUCardManager.app`. ScreenScraper developer credentials, if the repository has the secrets
# SS_DEVID and SS_DEVPASSWORD, are put into the build here; they are never committed.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "GD MENU Card Manager/**"
      - ".github/workflows/build-card-manager.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: "GD MENU Card Manager"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: "GD MENU Card Manager/global.json"
          dotnet-version: "6.0.x"

      - name: ScreenScraper developer credentials (from secrets, when there are any)
        env:
          SS_DEVID: ${{ secrets.SS_DEVID }}
          SS_DEVPASSWORD: ${{ secrets.SS_DEVPASSWORD }}
        run: |
          if ($env:SS_DEVID -and $env:SS_DEVPASSWORD) {
            $f = "src/GDMENUCardManager.Core/Scraper/ScreenScraperDevCredentials.cs"
            $c = Get-Content $f -Raw
            $id = $env:SS_DEVID.Replace('\', '\\').Replace('"', '\"')
            $pw = $env:SS_DEVPASSWORD.Replace('\', '\\').Replace('"', '\"')
            $c = $c.Replace('DevId = "";', "DevId = `"$id`";").Replace('DevPassword = "";', "DevPassword = `"$pw`";")
            Set-Content $f $c -NoNewline
            Write-Host "Built-in ScreenScraper developer ID set."
          } else {
            Write-Host "No SS_DEVID / SS_DEVPASSWORD secrets: users enter their own developer ID under Advanced."
          }

      - name: Scraper tests (offline)
        run: dotnet run -c Release --project src/GDMENUCardManager.ScraperTests/GDMENUCardManager.ScraperTests.csproj

      - name: Build Avalonia version
        run: dotnet build src/GDMENUCardManager.AvaloniaUI/GDMENUCardManager.AvaloniaUI.csproj -c Release

      - name: Publish Windows (WPF) version
        run: dotnet publish src/GDMENUCardManager/GDMENUCardManager.csproj -c Release -o "_out/GDMENUCardManager-win-x64"

      - uses: actions/upload-artifact@v4
        with:
          name: GDMENUCardManager-win-x64
          path: "GD MENU Card Manager/_out/GDMENUCardManager-win-x64"

  macos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    defaults:
      run:
        shell: bash
        working-directory: "GD MENU Card Manager"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: "GD MENU Card Manager/global.json"

      - name: ScreenScraper developer credentials (from secrets, when there are any)
        env:
          SS_DEVID: ${{ secrets.SS_DEVID }}
          SS_DEVPASSWORD: ${{ secrets.SS_DEVPASSWORD }}
        run: |
          if [ -n "$SS_DEVID" ] && [ -n "$SS_DEVPASSWORD" ]; then
            python3 - <<'PY'
          import os
          f = "src/GDMENUCardManager.Core/Scraper/ScreenScraperDevCredentials.cs"
          esc = lambda v: v.replace("\\", "\\\\").replace('"', '\\"')
          c = open(f).read()
          c = c.replace('DevId = "";', 'DevId = "%s";' % esc(os.environ["SS_DEVID"]))
          c = c.replace('DevPassword = "";', 'DevPassword = "%s";' % esc(os.environ["SS_DEVPASSWORD"]))
          open(f, "w").write(c)
          PY
            echo "Built-in ScreenScraper developer ID set."
          else
            echo "No SS_DEVID / SS_DEVPASSWORD secrets: users enter their own developer ID under Advanced."
          fi

      - name: rcodesign (ad-hoc signing on Linux)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin" /tmp/rcodesign
          gh release download "apple-codesign/0.29.0" -R indygreg/apple-platform-rs \
            --pattern "apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz" -D /tmp/rcodesign
          tar -xzf /tmp/rcodesign/*.tar.gz -C /tmp/rcodesign
          install "$(find /tmp/rcodesign -type f -name rcodesign | head -1)" "$HOME/.local/bin/rcodesign"
          rcodesign --version

      - name: Publish (osx-${{ matrix.arch }}, self-contained)
        run: |
          OUT="_releases/temp-osx-${{ matrix.arch }}"
          dotnet publish src/GDMENUCardManager.AvaloniaUI/GDMENUCardManager.AvaloniaUI.csproj -c Release \
            --self-contained true -r osx-${{ matrix.arch }} -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=true -o "$OUT"
          # as build.bat: the tools folder, without user-made menu options files
          mkdir -p "$OUT/tools"
          cp -R src/GDMENUCardManager.Core/tools/. "$OUT/tools/"
          rm -f "$OUT/tools/openMenu/menu_data/DEFAULTS.INI" "$OUT/tools/openMenu/menu_data/BGM.ADP"
          cp LICENSE README.md "$OUT/"

      - name: App bundle (ad-hoc signed)
        run: |
          VERSION="$(tr -d '\r\n' < src/version.txt)"
          bash create-macos-bundle.sh "_releases/temp-osx-${{ matrix.arch }}" "$VERSION" "_releases" "${{ matrix.arch }}"
          ls -l _releases/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: GDMENUCardManager-osx-${{ matrix.arch }}
          path: "GD MENU Card Manager/_releases/*.tar.gz"
