name: Build Card Manager

# Builds the GD MENU Card Manager (WPF for Windows, the Avalonia version for Linux and macOS) and runs the scraper's offline tests.
# Every build packs this repository's openMenu (the Build NewOpenMenu workflow runs first), not the 1ST_READ.BIN
# committed in the Card Manager's tools folder. Artifacts: the Windows build, and macOS app bundles for Apple Silicon (arm64) and Intel (x64). The bundles are
# cross-built on Linux and ad-hoc signed with rcodesign by Derek's create-macos-bundle.sh, as his releases are (hosted
# macOS runners are often not available). Such a bundle runs, but fails `codesign --verify --strict`; on a Mac it can
# be re-sealed with `codesign --force --deep -s - GDMENUCardManager.app`. ScreenScraper developer credentials, if the repository has the secrets
# SS_DEVID and SS_DEVPASSWORD, are put into the build here; they are never committed.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (tag = src/version.txt without the v; notes from .github/release-notes/<tag>.md)"
        type: boolean
        default: false
  push:
    branches: [dev]
    paths:
      - "GD MENU Card Manager/**"
      - "openMenu/**"
      - ".github/workflows/build-card-manager.yml"
      - ".github/workflows/build-newopenmenu.yml"

jobs:
  # This repository's openMenu (Build NewOpenMenu), packed into every Card Manager below instead of the 1ST_READ.BIN
  # that is committed in the Card Manager's tools folder (Derek's release)
  openmenu:
    uses: ./.github/workflows/build-newopenmenu.yml
    permissions:
      contents: write # the called workflow can publish binaries on manual runs; here it never does

  build:
    needs: openmenu
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: "GD MENU Card Manager"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: "GD MENU Card Manager/global.json"
          dotnet-version: "6.0.x"

      - name: This repository's openMenu into the Card Manager's menu data
        uses: actions/download-artifact@v4
        with:
          name: 1ST_READ.BIN
          path: "GD MENU Card Manager/src/GDMENUCardManager.Core/tools/openMenu/menu_data"

      - name: ScreenScraper developer credentials (from secrets, when there are any)
        env:
          SS_DEVID: ${{ secrets.SS_DEVID }}
          SS_DEVPASSWORD: ${{ secrets.SS_DEVPASSWORD }}
        run: |
          if ($env:SS_DEVID -and $env:SS_DEVPASSWORD) {
            $f = "src/GDMENUCardManager.Core/Scraper/ScreenScraperDevCredentials.cs"
            $c = Get-Content $f -Raw
            $id = $env:SS_DEVID.Replace('\', '\\').Replace('"', '\"')
            $pw = $env:SS_DEVPASSWORD.Replace('\', '\\').Replace('"', '\"')
            $c = $c.Replace('DevId = "";', "DevId = `"$id`";").Replace('DevPassword = "";', "DevPassword = `"$pw`";")
            Set-Content $f $c -NoNewline
            Write-Host "Built-in ScreenScraper developer ID set."
          } else {
            Write-Host "No SS_DEVID / SS_DEVPASSWORD secrets: users enter their own developer ID under Advanced."
          }

      - name: Check the packed openMenu
        run: |
          $f = "src/GDMENUCardManager.Core/tools/openMenu/menu_data/1ST_READ.BIN"
          Get-Item $f | Format-List Name, Length, LastWriteTime
          git diff --quiet -- $f
          if ($LASTEXITCODE -eq 0) { Write-Error "1ST_READ.BIN is still the committed one"; exit 1 }
          exit 0

      - name: Scraper tests (offline)
        run: dotnet run -c Release --project src/GDMENUCardManager.ScraperTests/GDMENUCardManager.ScraperTests.csproj

      - name: Build Avalonia version
        run: dotnet build src/GDMENUCardManager.AvaloniaUI/GDMENUCardManager.AvaloniaUI.csproj -c Release

      - name: Publish Windows (WPF) version
        run: |
          $out = "_out/GDMENUCardManager-win-x64"
          dotnet publish src/GDMENUCardManager/GDMENUCardManager.csproj -c Release -o $out
          # as build.bat: the tools folder, without user-made menu options files
          Copy-Item -Recurse -Force src/GDMENUCardManager.Core/tools "$out/tools"
          Remove-Item -ErrorAction SilentlyContinue "$out/tools/openMenu/menu_data/DEFAULTS.INI", "$out/tools/openMenu/menu_data/BGM.ADP"
          Copy-Item LICENSE, README.md $out

      - uses: actions/upload-artifact@v4
        with:
          name: GDMENUCardManager-win-x64
          path: "GD MENU Card Manager/_out/GDMENUCardManager-win-x64"

  linux:
    needs: openmenu
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: "GD MENU Card Manager"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: "GD MENU Card Manager/global.json"

      - name: ScreenScraper developer credentials (from secrets, when there are any)
        env:
          SS_DEVID: ${{ secrets.SS_DEVID }}
          SS_DEVPASSWORD: ${{ secrets.SS_DEVPASSWORD }}
        run: |
          if [ -n "$SS_DEVID" ] && [ -n "$SS_DEVPASSWORD" ]; then
            python3 - <<'PY'
          import os
          f = "src/GDMENUCardManager.Core/Scraper/ScreenScraperDevCredentials.cs"
          esc = lambda v: v.replace("\\", "\\\\").replace('"', '\\"')
          c = open(f).read()
          c = c.replace('DevId = "";', 'DevId = "%s";' % esc(os.environ["SS_DEVID"]))
          c = c.replace('DevPassword = "";', 'DevPassword = "%s";' % esc(os.environ["SS_DEVPASSWORD"]))
          open(f, "w").write(c)
          PY
            echo "Built-in ScreenScraper developer ID set."
          else
            echo "No SS_DEVID / SS_DEVPASSWORD secrets: users enter their own developer ID under Advanced."
          fi

      - name: This repository's openMenu into the Card Manager's menu data
        uses: actions/download-artifact@v4
        with:
          name: 1ST_READ.BIN
          path: "GD MENU Card Manager/src/GDMENUCardManager.Core/tools/openMenu/menu_data"

      - name: Publish (linux-x64, self-contained)
        run: |
          VERSION="$(tr -d '\r\n' < src/version.txt)"
          NAME="GDMENUCardManager.$VERSION-linux-x64"
          OUT="_releases/$NAME"
          dotnet publish src/GDMENUCardManager.AvaloniaUI/GDMENUCardManager.AvaloniaUI.csproj -c Release \
            --self-contained true -r linux-x64 -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=true -o "$OUT"
          # as build.bat: the tools folder, without user-made menu options files
          mkdir -p "$OUT/tools"
          cp -R src/GDMENUCardManager.Core/tools/. "$OUT/tools/"
          rm -f "$OUT/tools/openMenu/menu_data/DEFAULTS.INI" "$OUT/tools/openMenu/menu_data/BGM.ADP"
          cp LICENSE README.md "$OUT/"
          chmod +x "$OUT/GDMENUCardManager" 2>/dev/null || true
          tar -C _releases -czf "_releases/$NAME.tar.gz" "$NAME"
          ls -l _releases/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: GDMENUCardManager-linux-x64
          path: "GD MENU Card Manager/_releases/*.tar.gz"

  macos:
    needs: openmenu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    defaults:
      run:
        shell: bash
        working-directory: "GD MENU Card Manager"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: "GD MENU Card Manager/global.json"

      - name: ScreenScraper developer credentials (from secrets, when there are any)
        env:
          SS_DEVID: ${{ secrets.SS_DEVID }}
          SS_DEVPASSWORD: ${{ secrets.SS_DEVPASSWORD }}
        run: |
          if [ -n "$SS_DEVID" ] && [ -n "$SS_DEVPASSWORD" ]; then
            python3 - <<'PY'
          import os
          f = "src/GDMENUCardManager.Core/Scraper/ScreenScraperDevCredentials.cs"
          esc = lambda v: v.replace("\\", "\\\\").replace('"', '\\"')
          c = open(f).read()
          c = c.replace('DevId = "";', 'DevId = "%s";' % esc(os.environ["SS_DEVID"]))
          c = c.replace('DevPassword = "";', 'DevPassword = "%s";' % esc(os.environ["SS_DEVPASSWORD"]))
          open(f, "w").write(c)
          PY
            echo "Built-in ScreenScraper developer ID set."
          else
            echo "No SS_DEVID / SS_DEVPASSWORD secrets: users enter their own developer ID under Advanced."
          fi

      - name: This repository's openMenu into the Card Manager's menu data
        uses: actions/download-artifact@v4
        with:
          name: 1ST_READ.BIN
          path: "GD MENU Card Manager/src/GDMENUCardManager.Core/tools/openMenu/menu_data"

      - name: Check the packed openMenu
        run: |
          f=src/GDMENUCardManager.Core/tools/openMenu/menu_data/1ST_READ.BIN
          ls -l "$f"; sha1sum "$f"
          if git diff --quiet -- "$f"; then echo "::error::1ST_READ.BIN is still the committed one"; exit 1; fi

      - name: rcodesign (ad-hoc signing on Linux)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin" /tmp/rcodesign
          gh release download "apple-codesign/0.29.0" -R indygreg/apple-platform-rs \
            --pattern "apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz" -D /tmp/rcodesign
          tar -xzf /tmp/rcodesign/*.tar.gz -C /tmp/rcodesign
          install "$(find /tmp/rcodesign -type f -name rcodesign | head -1)" "$HOME/.local/bin/rcodesign"
          rcodesign --version

      - name: Publish (osx-${{ matrix.arch }}, self-contained)
        run: |
          OUT="_releases/temp-osx-${{ matrix.arch }}"
          dotnet publish src/GDMENUCardManager.AvaloniaUI/GDMENUCardManager.AvaloniaUI.csproj -c Release \
            --self-contained true -r osx-${{ matrix.arch }} -p:PublishSingleFile=false \
            -p:IncludeNativeLibrariesForSelfExtract=true -o "$OUT"
          # as build.bat: the tools folder, without user-made menu options files
          mkdir -p "$OUT/tools"
          cp -R src/GDMENUCardManager.Core/tools/. "$OUT/tools/"
          rm -f "$OUT/tools/openMenu/menu_data/DEFAULTS.INI" "$OUT/tools/openMenu/menu_data/BGM.ADP"
          cp LICENSE README.md "$OUT/"

      - name: App bundle (ad-hoc signed)
        run: |
          VERSION="$(tr -d '\r\n' < src/version.txt)"
          bash create-macos-bundle.sh "_releases/temp-osx-${{ matrix.arch }}" "$VERSION" "_releases" "${{ matrix.arch }}"
          ls -l _releases/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: GDMENUCardManager-osx-${{ matrix.arch }}
          path: "GD MENU Card Manager/_releases/*.tar.gz"

  # A manual run with release ticked: one GitHub release with every build, named as UpdateManager downloads them
  # (GDMENUCardManager.v<tag>-<platform>), and openMenu's 1ST_READ.BIN
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [openmenu, build, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # by name: the Docker build record artifact (*.dockerbuild) cannot be extracted and fails a download of all
      - uses: actions/download-artifact@v4
        with:
          pattern: GDMENUCardManager-*
          path: _art
      - uses: actions/download-artifact@v4
        with:
          name: 1ST_READ.BIN
          path: _art/1ST_READ.BIN

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(tr -d '\r\n' < "GD MENU Card Manager/src/version.txt")"
          TAG="${VERSION#v}"
          mkdir -p _rel
          (cd _art/GDMENUCardManager-win-x64 && zip -qr "$GITHUB_WORKSPACE/_rel/GDMENUCardManager.$VERSION-win-x64.zip" .)
          cp _art/GDMENUCardManager-linux-x64/*.tar.gz _art/GDMENUCardManager-osx-*/*.tar.gz _rel/
          cp _art/1ST_READ.BIN/1ST_READ.BIN _rel/
          ls -l _rel
          NOTES=".github/release-notes/$TAG.md"
          [ -f "$NOTES" ] || { echo "no $NOTES"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists already"; exit 1
          fi
          gh release create "$TAG" _rel/* --target "$GITHUB_SHA" --title "openMenu Virtual Folder Bundle $TAG" --notes-file "$NOTES"
